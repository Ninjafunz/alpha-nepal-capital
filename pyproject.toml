[project]
name = "alpha-nepal-capital"
version = "0.1.0"
description = "AI-Managed Virtual Investment Company executing the ASA-V1.ethics strategy on NEPSE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "scipy>=1.14.1",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "pydantic>=2.10.4",
    "yfinance>=0.2.0",
]

[project.scripts]
alpha-nepal = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
