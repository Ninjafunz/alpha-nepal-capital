name: Daily Autonomous Investment Cycle

on:
  schedule:
    # NEPSE trades Sunday through Thursday.
    # Market closes at 3:00 PM NPT. 3:15 PM NPT = 09:30 UTC (Sun-Thu).
    - cron: '30 9 * * 0-4'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-daily-simulation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Execute Autonomous Daily Cycle
        run: |
          python -m src.cli run-daily

      - name: Commit and Push Updated Website JSON Data
        run: |
          git config user.name "Alpha Nepal Capital AI"
          git config user.email "ai@alpha-nepal-capital.internal"
          git add website/data/
          git diff --staged --quiet || git commit -m "📊 Daily Simulation Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

  # After data is committed, redeploy the GitHub Pages site so the live site reflects the new JSON
  deploy-pages:
    needs: run-daily-simulation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (after data commit)
        uses: actions/checkout@v4
        with:
          ref: main   # Ensure we get the freshly committed JSON

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
