# ==============================================================================
# Alpha Nepal Capital — Global Investment Policy Statement (IPS) & Constitution
# Version: 3.0.0 (Multi-Asset Global SAA & Tactical Tilt Edition)
# Governing Philosophy: ASA-V1.ethics
# Chief Strategist / Founder: Human Founder
# Operating Management: Autonomous AI Agent (Level 3 Autonomy)
# ==============================================================================

company:
  name: "Alpha Nepal Capital"
  founded: "2026-08-20"
  starting_capital: 100000000.0   # NPR 100,000,000 (100 Million Base)
  shares_outstanding: 10000000.0  # 10,000,000 virtual shares
  starting_nav: 10.0              # NPR 10.00 / share
  currency: "NPR"
  autonomy_level: 3               # Level 3: Fully Autonomous Execution

investment_objective: >
  Maximize long-term risk-adjusted capital growth through dynamic Multi-Asset
  Strategic Asset Allocation (SAA) and regime-adaptive Tactical Tilts across
  Nepalese Equities, Global ETFs, Precious Metals (Gold), Digital Assets (BTC/ETH),
  and Cash/FX. Operate strictly within the ASA-V1.ethics framework treating cross-asset
  correlation, currency risk (USD/NPR), and liquidity fragmentation as primary structural challenges.

# ------------------------------------------------------------------------------
# 1. STRATEGIC ASSET ALLOCATION (SAA) BASELINE TARGETS
# ------------------------------------------------------------------------------
strategic_asset_allocation:
  equities:
    total_pct: 40.0
    domestic_nepse_pct: 20.0
    global_etfs_pct: 20.0
  gold_and_metals:
    total_pct: 20.0
    physical_proxy_target_pct: 65.0  # Physical/GLD proxy backing minimum 50%
  digital_assets:
    total_pct: 15.0
    btc_target_pct: 10.0
    eth_target_pct: 5.0
  fx_and_cash:
    total_pct: 25.0
    npr_cash_pct: 15.0
    usd_cash_pct: 10.0

# ------------------------------------------------------------------------------
# 2. MACRO REGIME DETECTION & TACTICAL TILT ENGINE
# ------------------------------------------------------------------------------
macro_regime_framework:
  indicators:
    us_10y_yield_symbol: "^TNX"
    dxy_proxy_symbol: "UUP"
    vix_symbol: "^VIX"
    gold_symbol: "GLD"
    btc_symbol: "BTC-USD"
    usd_npr_symbol: "NPR=X"
  
  max_tactical_tilt_pct: 10.0       # Max ±10% deviation from baseline SAA
  
  regime_tilts:
    risk_on:
      equities_tilt: 5.0
      gold_tilt: -4.0
      crypto_tilt: 3.0
      cash_tilt: -4.0
      rationale: "Accommodative liquidity, low VIX, bullish equity momentum."
    risk_off:
      equities_tilt: -5.0
      gold_tilt: 6.0
      crypto_tilt: -5.0
      cash_tilt: 4.0
      rationale: "Elevated VIX, safe-haven demand, risk asset deleveraging."
    stagflation:
      equities_tilt: -6.0
      gold_tilt: 8.0
      crypto_tilt: -4.0
      cash_tilt: 2.0
      rationale: "Rising yields and commodities with slowing growth; physical store of value priority."
    liquidity_crunch:
      equities_tilt: -8.0
      gold_tilt: -2.0
      crypto_tilt: -8.0
      cash_tilt: 18.0
      rationale: "Dollar surge, credit spread widening; maximum liquidity preservation."

# ------------------------------------------------------------------------------
# 3. UNIFIED RISK OVERRIDES & CONSTRAINTS
# ------------------------------------------------------------------------------
unified_risk_overrides:
  # Currency Risk Override: If USD assets > 40% NAV -> auto-hedge 50% via simulated FX forwards
  currency_risk:
    max_usd_exposure_pct: 40.0
    auto_hedge_ratio_pct: 50.0
    npr_appreciation_hedge_trigger_pct: 5.0  # 30-day NPR surge trigger

  # Volatility Override: If Crypto 30d annualized vol > 80% -> cut position size by 50%
  volatility_override:
    crypto_vol_threshold_pct: 80.0
    crypto_size_reduction_pct: 50.0
    crypto_vol_target_band: [30.0, 60.0]
    max_portfolio_volatility_ex_crypto_pct: 15.0

  # Liquidity Override: Max 5% NAV in assets with < $10M avg daily volume
  liquidity_override:
    min_global_daily_volume_usd: 10000000.0
    illiquid_max_nav_pct: 5.0

  # Concentration Override: No single equity > 5% NAV; no single crypto > 3% NAV
  concentration_limits:
    max_single_equity_pct: 5.0
    max_single_crypto_pct: 3.0
    max_single_commodity_pct: 15.0

# ------------------------------------------------------------------------------
# 4. SPECIAL GOVERNANCE PROTOCOLS & RED LINES
# ------------------------------------------------------------------------------
special_governance_protocols:
  crypto:
    absolute_hard_cap_pct: 20.0
    max_unregulated_exchange_pct: 5.0
    max_unclear_sec_tokens_pct: 3.0
    kyc_aml_auto_liquidate_hours: 24
  gold:
    absolute_hard_cap_pct: 30.0
    min_physical_custody_audit_pct: 50.0
    allow_leveraged_derivatives: false
  global_equities:
    max_single_non_us_country_pct: 25.0
    max_defense_weapons_pct: 5.0
    esg_thermal_coal_revenue_cutoff_pct: 10.0
  fx_cash:
    max_usd_allocation_pct: 50.0
    min_cash_reserve_pct: 5.0

# ------------------------------------------------------------------------------
# 5. STRUCTURAL ANCHORING & COGNITIVE DELTA
# ------------------------------------------------------------------------------
structural_variables:
  capital_velocity_weight: 0.25
  physical_operational_weight: 0.25
  regulatory_transition_weight: 0.25
  bottleneck_asymmetry_weight: 0.25

literature_audit:
  elite_alignment_weight: 0.25
  sentiment_position_weight: 0.25
  real_options_weight: 0.25
  golden_zone_weight: 0.25
  max_fair_value_sigma: 1.5

cognitive_delta:
  min_delta_threshold_pct: 20.0
  aggressive_delta_threshold_pct: 40.0
  bias_penalty_narrative: 0.35
  bias_penalty_anchoring: 0.35
  bias_penalty_recency: 0.30

# ------------------------------------------------------------------------------
# 6. STRATEGIC ROUTES
# ------------------------------------------------------------------------------
strategic_routes:
  route_alpha:
    name: "Route Alpha (Defensive Moat)"
    description: "Insulated infrastructure & sovereign-linked recurring cash flows"
    target_allocation_pct: 60.0
  route_beta:
    name: "Route Beta (Contra-Cyclical Raid)"
    description: "Deep value, beaten-down high operating leverage, turnaround plays"
    target_allocation_pct: 25.0
  route_gamma:
    name: "Route Gamma (Policy Hack)"
    description: "Exceeding regulatory standards by 20%+, compliance-first moats"
    target_allocation_pct: 15.0

portfolio_constraints:
  max_single_position_pct: 5.0       # Strict global cap (5%)
  max_sector_pct: 40.0
  min_cash_pct: 5.0
  max_cash_pct: 50.0
  defensive_cash_pct: 30.0
  max_positions: 25
  min_position_size_pct: 1.0
  max_portfolio_volatility_annual: 15.0
  max_drawdown_warning_pct: 10.0
  max_drawdown_defensive_pct: 15.0
  max_drawdown_halt_pct: 20.0

transaction_costs:
  broker_commission_pct: 0.36
  sebon_fee_pct: 0.015
  dp_charge_npr: 25.0
  slippage_pct: 0.10

company_status_thresholds:
  flourishing:
    min_return_pct: 5.0
    min_alpha_pct: 0.0
    max_drawdown_pct: 10.0
  stable:
    min_return_pct: 0.0
    max_drawdown_pct: 15.0
  declining:
    max_return_pct: 0.0
  critical:
    max_return_pct: -10.0

leverage:
  enabled: false
  max_leverage_ratio: 1.0
  margin_call_trigger_pct: -10.0
  borrowing_rate_spread_pct: 2.0
